<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ventas — Sun Shine</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F5A524">
  <link rel="icon" href="/icono.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/estilos.css">
</head>
<body>
  <main class="admin">
    <p class="marca"><span class="sol" aria-hidden="true"></span>Sun Shine</p>
    <h1>Control de ventas</h1>

    <form class="acceso" id="acceso">
      <label for="clave" class="nota" style="flex-basis:100%;margin:0">Contraseña del panel</label>
      <input id="clave" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
    <p class="error" id="error" hidden></p>

    <section id="panel" hidden>
      <!-- Filtros: una sola fila sobre las gráficas -->
      <div class="filtros" role="group" aria-label="Periodo">
        <div class="rapidos" id="rapidos">
          <button type="button" data-p="hoy">Hoy</button>
          <button type="button" data-p="7">7 días</button>
          <button type="button" data-p="30" aria-pressed="true">30 días</button>
          <button type="button" data-p="mes">Este mes</button>
          <button type="button" data-p="anio">Este año</button>
          <button type="button" data-p="todo">Todo</button>
        </div>
        <label>Desde <input type="date" id="desde"></label>
        <label>Hasta <input type="date" id="hasta"></label>
        <label>Moneda <select id="moneda-panel"><option value="mxn">🇲🇽 MXN</option><option value="usd">🇺🇸 USD</option></select></label>
        <button type="button" class="excel" id="excel">⬇ Descargar Excel</button>
      </div>
      <p class="estado-carga" id="carga" aria-live="polite"></p>

      <div class="kpis">
        <div class="kpi principal"><span>Ventas netas</span><strong id="k-ventas">—</strong></div>
        <div class="kpi"><span>Pedidos cobrados</span><strong id="k-pedidos">—</strong></div>
        <div class="kpi"><span>Ticket promedio</span><strong id="k-ticket">—</strong></div>
        <div class="kpi"><span>Piezas vendidas</span><strong id="k-piezas">—</strong></div>
      </div>
      <p class="nota" id="k-extra"></p>

      <div class="graficas">
        <figure class="grafica ancha">
          <figcaption>
            <span><strong id="t-tiempo">Ventas por día</strong><small>Ventas netas · pasa el cursor sobre una barra</small></span>
            <button type="button" class="ver-tabla" data-tabla="tabla-tiempo" aria-expanded="false">Ver tabla</button>
          </figcaption>
          <div class="lienzo" id="g-tiempo"></div>
          <div class="tabla-envoltura" id="tabla-tiempo" hidden></div>
        </figure>

        <figure class="grafica">
          <figcaption>
            <span><strong>Ventas por categoría</strong><small>Hogar, jardinería, limpieza, electrónicos</small></span>
          </figcaption>
          <div class="lienzo" id="g-categoria"></div>
        </figure>

        <figure class="grafica">
          <figcaption>
            <span><strong>Ventas por producto</strong><small>Del periodo, de mayor a menor</small></span>
          </figcaption>
          <div class="lienzo" id="g-producto"></div>
        </figure>
      </div>

      <div class="cabecera-pedidos">
        <h2>Apartados</h2>
        <div class="rapidos" id="filtro-ap" role="group" aria-label="Filtrar apartados">
          <button type="button" data-f="activos" aria-pressed="true">Por cobrar</button>
          <button type="button" data-f="vencido">Vencidos</button>
          <button type="button" data-f="liquidado">Liquidados</button>
          <button type="button" data-f="todos">Todos</button>
        </div>
      </div>
      <p class="nota" id="ap-resumen" style="margin-top:0"></p>
      <ul class="pedidos" id="apartados"></ul>
      <p class="vacio" id="ap-vacio" hidden>No hay apartados aquí.</p>

      <div class="cabecera-pedidos" style="margin-top:2.5rem">
        <h2>Pedidos</h2>
        <input type="search" id="buscar" placeholder="Buscar cliente, email o producto" aria-label="Buscar pedidos">
      </div>
      <p class="vacio" id="vacio" hidden>No hay pedidos en este periodo.</p>
      <ul class="pedidos" id="pedidos"></ul>
      <p class="nota" id="mas"></p>
    </section>
  </main>
  <div class="tooltip" id="tooltip" role="status" hidden></div>

<script src="/js/admin.js"></script>
</body>
</html>
