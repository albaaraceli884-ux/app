# Despliegue en Render (https://render.com) — "New > Blueprint" y elige este repositorio.
# Las llaves NO van aquí: Render te las pedirá en el panel (sync: false).
services:
  - type: web
    name: sunshine-tienda
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /salud
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODO
        value: sandbox
      # Tu dominio: lo usan el código QR, los enlaces de pago y apartados, y el sitemap
      - key: DOMAIN
        value: https://sunshinetienda.com
      - key: AMAZON_TAG_MX
        sync: false
      - key: AMAZON_TAG_US
        sync: false
        sync: false
